name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - api
          - worker

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: ${{ matrix.target }}
          load: true
          tags: primind-tasks-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Check grpc_health_probe
        run: docker run --rm --entrypoint /grpc_health_probe primind-tasks-${{ matrix.target }}:ci -version

      - name: Start next to Redis
        env:
          IMAGE: primind-tasks-${{ matrix.target }}:ci
          TARGET: ${{ matrix.target }}
        run: |
          docker network create smoke
          docker run -d --name redis --network smoke redis:8-alpine
          docker run -d --name app --network smoke \
            -e REDIS_ADDR=redis:6379 -e TARGET_ENDPOINT=http://127.0.0.1:9/webhook -e OTEL_EXPORTER_DISABLED=true "$IMAGE"
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
            if [ "$TARGET" = api ]; then
              docker exec app /grpc_health_probe -addr=localhost:8080 && exit 0
            elif [ "$(docker exec redis redis-cli ZCARD asynq:servers)" -gt 0 ]; then
              sleep 3
              [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] && exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          scan-type: fs
          vuln-type: 'os,library'
